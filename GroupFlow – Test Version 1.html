<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GroupFlow – Plan. Collaborate. Achieve.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#5427B8;--l:#A78BFA;--bg:#F8F7FC;--w:#fff;--t:#29233A;--m:#6f6884;--ok:#36A875;--wa:#F2AD45;--er:#E76B76;--bd:#e7e3f3;--sh:0 4px 18px rgba(84,39,184,.08);--soft:#efeafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17131f;--w:#211b2e;--t:#eeeaf8;--m:#a59db9;--bd:#352d48;--soft:#2c2342;--sh:0 4px 18px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#17131f;--w:#211b2e;--t:#eeeaf8;--m:#a59db9;--bd:#352d48;--soft:#2c2342;--sh:0 4px 18px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,sans-serif;margin:0}h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--w);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .nv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--m);font-weight:500;margin:2px 0}
.side .nv:hover{background:var(--soft)}.side .nv.on{background:var(--p);color:#fff}
.main{padding:22px 28px;min-width:0}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top input{flex:1;min-width:140px}.av{width:38px;height:38px;border-radius:50%;background:var(--l);color:#fff;display:grid;place-items:center;font-weight:600;cursor:pointer;flex:none}
.card{background:var(--w);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mt{margin-top:16px}.mu{color:var(--m);font-size:13px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--p);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.s{background:var(--soft);color:var(--p)}button.d{background:var(--er)}button.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--l);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--t);background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--l));border-radius:9px}
.bd{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--p)}
.High,.Overdue{background:#e76b7626;color:var(--er)}.Medium,.Pending{background:#f2ad4529;color:#b9771a}.Low,.Active,.Done{background:#36a87522;color:var(--ok)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin:14px 0;overflow:auto}.tabs b{padding:9px 14px;cursor:pointer;color:var(--m);border-bottom:3px solid transparent;white-space:nowrap}.tabs b.on{color:var(--p);border-color:var(--p)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;overflow:auto}.col{background:var(--soft);border-radius:16px;padding:12px}
.tk{background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.pr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.pr:last-child{border:0}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.un{border-left:4px solid var(--p)}.cl{cursor:pointer}.cl:hover{transform:translateY(-2px)}
.ms{max-width:75%;padding:9px 13px;border-radius:14px;background:var(--soft);margin:8px 0}.ms.me{background:var(--p);color:#fff;margin-left:auto}
.chat{display:grid;grid-template-columns:190px 1fr;gap:14px}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:50}.ov .card{width:min(440px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:62px;background:var(--w);border:1px solid var(--bd);border-radius:10px;padding:4px;font-size:12px}.cal .h{min-height:0;border:0;background:none;font-weight:600;color:var(--m)}
.cal em{display:block;background:var(--p);color:#fff;border-radius:6px;padding:0 4px;margin-top:2px;font-style:normal;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.full{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--p),#3a1a87 70%);}
.full .card{width:min(430px,100%)}.splash{color:#fff;text-align:center}
.ld{width:140px;height:5px;background:#fff3;border-radius:5px;margin:22px auto;overflow:hidden}.ld i{display:block;height:100%;background:#fff;animation:ld 2.2s ease forwards}@keyframes ld{from{width:0}to{width:100%}}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px}
.focus .side,.focus .nofocus{display:none}.focus .app{grid-template-columns:1fr}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}.donut b{background:var(--w);width:94px;height:94px;border-radius:50%;display:grid;place-items:center;font:600 22px Poppins}
.bars{display:flex;gap:14px;align-items:flex-end;height:120px}.bars div{flex:1;background:linear-gradient(var(--l),var(--p));border-radius:8px 8px 0 0;position:relative;min-height:6px}.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--m)}
@media(max-width:820px){.app{grid-template-columns:1fr;padding-bottom:64px}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;display:flex;padding:6px;border:0;border-top:1px solid var(--bd);overflow-x:auto}.side .lg{display:none}.side .nv{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;flex:none}.main{padding:16px}.chat{grid-template-columns:1fr}.cols{grid-template-columns:repeat(3,260px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="r"></div><div id="m"></div><input type="file" id="fi" hidden>
<script>
const logo=(s=40,c=1)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="${c?'#5427B8':'#fff'}"/><circle cx="24" cy="14" r="5" fill="${c?'#fff':'#5427B8'}"/><circle cx="12" cy="19" r="4" fill="#A78BFA"/><circle cx="36" cy="19" r="4" fill="#A78BFA"/><path d="M13 36c0-7 5-10 11-10s11 3 11 10" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/><path d="M18 30l4 4 8-8" fill="none" stroke="${c?'#fff':'#5427B8'}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const word=(c)=>`<span class="row" style="gap:8px">${logo(34,c!=='w')}<b style="font:700 20px Poppins;color:${c==='w'?'#fff':'var(--p)'}">GroupFlow</b></span>`;
const S={role:null,scr:'splash',tacc:1,act:[],mq:'',cvw:0,ptab:'Overview',view:'kanban',focus:0,ch:'General',q:'',flt:'All',cls:'CS101',grp:'Group 3',
members:[{n:'Primo Reyes',r:'Leader',d:5,a:5},{n:'Bella Santos',r:'Research & Writing',d:4,a:5},{n:'Ethan Mendoza',r:'Slides & Design',d:3,a:5}],
tasks:[{id:1,t:'Draft project outline',w:'Primo Reyes',due:'Nov 3',p:'High',s:'Done'},{id:2,t:'Write literature review',w:'Bella Santos',due:'Nov 5',p:'High',s:'In Progress'},{id:3,t:'Design presentation slides',w:'Ethan Mendoza',due:'Nov 7',p:'Medium',s:'To Do'},{id:4,t:'Collect survey responses',w:'Ethan Mendoza',due:'Oct 29',p:'High',s:'To Do',od:1},{id:5,t:'Prepare references list',w:'Bella Santos',due:'Nov 10',p:'Low',s:'To Do'},{id:6,t:'Compile final report',w:'Primo Reyes',due:'Nov 12',p:'Medium',s:'In Progress'},{id:7,t:'Create group charter',w:'Primo Reyes',due:'Oct 20',p:'Low',s:'Done'}],
notifs:[{c:'Task Assignments',i:'📌',t:'Primo assigned you “Prepare references list”',p:'Research Methods',d:'Today, 9:12 AM',u:1},{c:'Deadline Reminders',i:'⏰',t:'“Collect survey responses” is overdue',p:'Research Methods',d:'Today, 8:00 AM',u:1},{c:'Group Messages',i:'💬',t:'Bella replied to your suggestion',p:'Research Methods',d:'Yesterday, 4:40 PM',u:1},{c:'Project Updates',i:'📈',t:'Project progress reached 68%',p:'Research Methods',d:'Yesterday, 2:10 PM',u:0},{c:'Feedback',i:'⭐',t:'Ms. Lans left feedback on your outline',p:'Research Methods',d:'Oct 28, 10:30 AM',u:0}],
msgs:{General:[['Primo','Hi team! Draft outline is uploaded in Files.','9:01 AM','me'],['Bella','Thanks! I added two ideas under Ideas channel — no rush to reply 🙂','9:14 AM'],['Ethan','Got it. I’ll start on slides after the survey.','9:20 AM']],Announcements:[['Ms. Lans','Reminder: progress check-in on Nov 8. Please update your tasks.','Mon 8:00 AM']],Ideas:[['Bella','Idea: add a short case study to the intro. Happy for written feedback!','Tue 3:02 PM'],['Primo','Love it, Bella. Added to the outline.','Tue 3:30 PM','me']],'Direct: Bella':[['Bella','Could I get private feedback on my draft before the group sees it?','Tue 5:00 PM']]},
files:[['Project Outline.docx','📄','Primo Reyes','Oct 22'],['Survey Results.xlsx','📊','Ethan Mendoza','Oct 30'],['Final Slides.pptx','📽️','Ethan Mendoza','Oct 29'],['Team Photo.png','🖼️','Bella Santos','Oct 25'],['Literature Notes.pdf','📕','Bella Santos','Oct 27']],
fb:[['Ms. Lans Garcia','Oct 28','Strong outline, Primo. Next step: define measurable objectives. Bella’s case-study idea is a good addition to include.'],['Ms. Lans Garcia','Oct 24','Great start on the charter. Please make each member’s responsibilities more specific.']]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const okm=v=>v.includes('@')&&v.split('@')[1].includes('.');
const nm=()=>S.role==='teacher'?'Ms. Lans Garcia':(S.nm||'Primo Reyes');
const ini=()=>S.role==='teacher'?'LG':nm().split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const nmfix=e=>esc(e.split('@')[0].replace(/[._-]/g,' ').split(' ').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' '));
const log=(i,t)=>S.act.unshift([i,t,'Just now']);
const push=(c,i,t)=>S.notifs.unshift({c,i,t,p:proj[0][0],d:'Just now',u:1});
const fdate=v=>v?new Date(v+'T00:00').toLocaleString('en',{month:'short',day:'numeric'}):'Nov 20';
const sync=()=>{const T=new Date('2026-10-31T00:00');S.tasks.forEach(t=>{t.od=new Date(t.due+' 2026')<T});S.members.forEach(m=>{if(S.fresh||m.live){const a=S.tasks.filter(t=>t.w===m.n);m.a=a.length;m.d=a.filter(t=>t.s==='Done').length}});proj[0][3]=pct()};
const GP=()=>[['Group 1',82],['Group 2',64],...(S.tacc?[[proj[0][1],pct()]]:[]),['Group 4',31]];
const gsr=q=>{const o=$('#sr');o&&o.remove();q=q.trim().toLowerCase();if(q.length<2)return;const h=[],m=s=>String(s).toLowerCase().includes(q),a=(i,t,s,g)=>h.push(`<div class="pr cl" data-go="${g}"><div class="ico">${i}</div><div><b>${t}</b><div class="mu">${s}</div></div></div>`);proj.forEach(p=>m(p[0])&&a('📁',p[0],'Project','pd'));S.tasks.forEach(t=>(m(t.t)||m(t.w))&&a('✅',t.t,t.w+' · Due '+t.due,'tasks'));S.files.forEach(f=>m(f[0])&&a(f[1],f[0],'File by '+f[2],'files'));S.members.forEach(x=>m(x.n)&&a('👤',x.n,x.r,'pd'));Object.entries(S.msgs).forEach(([c,l])=>l.forEach(x=>m(x[1])&&a('💬',x[1].replace(/<[^>]+>/g,'').slice(0,50),'#'+c+' · '+x[0],'chat')));document.body.insertAdjacentHTML('beforeend',`<div id="sr" class="card" style="position:fixed;top:70px;left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:40;max-height:60vh;overflow:auto"><b>${h.length} result${h.length==1?'':'s'}</b>${h.join('')||'<p class="mu">No matches. Try a task, file, or person.</p>'}</div>`)};
const go=(s,o={})=>{Object.assign(S,o,{scr:s});if(s==='dash'&&S.role==='teacher')S.scr='tdash';render();scrollTo(0,0)};
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const pct=()=>S.tasks.length?Math.round(S.tasks.filter(t=>t.s==='Done').length/S.tasks.length*100):0;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const cp=m=>m.a?Math.round(m.d/m.a*100):0;
const proj=[['Research Methods Paper','Group 3','Nov 15',pct(),'Active'],['Marketing Case Study','Group 3','Dec 2',35,'Active'],['Intro to IT Poster','Group 3','Oct 10',100,'Completed'],['Old Capstone Draft','Group 1','Aug 1',100,'Archived']];
const stud=[['dash','🏠','Dashboard'],['projects','📁','Projects'],['tasks','✅','Tasks'],['chat','💬','Chat'],['progress','📊','Progress'],['calendar','📅','Calendar'],['files','🗂️','Files'],['notifs','🔔','Alerts'],['feedback','⭐','Feedback'],['profile','👤','Profile']];
const tea=[['tdash','🏠','Dashboard'],['classes','🏫','Classes'],['monitor','📊','Monitoring'],['part','🧑‍🎓','Participation'],['evalu','⭐','Feedback'],['profile','👤','Profile']];
const lay=(body,title)=>{const T=S.role==='teacher',nav=T?tea:stud,me=T?'Ms. Lans Garcia':'Primo Reyes';
return `<div class="app"><aside class="side"><div class="lg" style="padding:6px 8px 16px">${word()}</div>${nav.map(n=>`<div class="nv ${S.scr===n[0]||(S.scr==='pd'&&n[0]==='projects')?'on':''}" data-go="${n[0]}"><span>${n[1]}</span>${n[2]}</div>`).join('')}</aside><main class="main"><div class="top"><span class="nofocus" style="display:none"></span><input placeholder="Search projects, tasks, files…" aria-label="Search" id="gs"><button class="s sm" data-act="focus">${S.focus?'Exit Focus Mode':'🎯 Focus Mode'}</button><button class="s sm" data-go="notifs" aria-label="Notifications">🔔 ${S.notifs.filter(n=>n.u).length}</button><div class="av" data-go="profile" title="${nm()}">${ini()}</div></div>${body}</main></div>`};
const hello=()=>S.role==='teacher'?`<h1>Good morning, Ms. Lans!</h1><p class="mu">Monitor your students’ collaboration and project progress.</p>`:`<h1>Good morning, ${nm().split(' ')[0]}!</h1><p class="mu">Let’s make your group project a success.</p>`;
const task=(t,k)=>`<div class="tk"><div class="row sp"><b>${t.t}</b><span class="bd ${t.p}">${t.p}</span></div><div class="mu">${t.w} · Due ${t.due} ${t.od&&t.s!=='Done'?'<span class="bd Overdue">Overdue</span>':''}</div>${k?`<div class="row mt"><select data-st="${t.id}" aria-label="Status" style="padding:5px;width:auto">${['To Do','In Progress','Done'].map(x=>`<option ${x===t.s?'selected':''}>${x}</option>`).join('')}</select><button class="sm s" data-cm="${t.id}">💬 Comment${t.cm?' ('+t.cm.length+')':''}</button><button class="sm d" data-act="dt" data-id="${t.id}">Delete</button></div>`:''}</div>`;
const pcard=p=>`<div class="card cl" data-go="pd"><div class="row sp"><h3>${p[0]}</h3><span class="bd ${p[4]==='Active'?'Active':''}">${p[4]}</span></div><p class="mu">${p[1]} · Leader: Primo Reyes · Due ${p[2]}</p>${bar(p[3])}<div class="mu mt">${p[3]}% complete</div></div>`;
const donut=(p,c='var(--p)')=>`<div class="donut" style="background:conic-gradient(${c} ${p}%,var(--soft) 0)"><b>${p}%</b></div>`;
const R={
splash:()=>`<div class="full"><div class="splash"><div style="display:inline-block">${logo(96,0)}</div><h1 style="font-size:40px;margin-top:14px">GroupFlow</h1><p style="opacity:.85">Plan. Collaborate. Achieve.</p><div class="ld"><i></i></div></div></div>`,
welcome:()=>`<div class="full"><div style="width:min(900px,100%);color:#fff"><div style="margin-bottom:20px">${word('w')}</div><h1 style="font-size:34px">Welcome to GroupFlow</h1><p style="max-width:560px;opacity:.9">One organized place for your group project: fair task sharing, calm conversations, clear progress, and helpful feedback from your instructor.</p><div class="g g3 mt">${[['✅','Organize Your Tasks','Break work into clear steps with priorities and deadlines.'],['🤝','Collaborate With Your Team','Organized channels, files, and private feedback.'],['📈','Track Your Progress','See real contributions based on completed work.']].map(c=>`<div class="card" style="color:var(--t)"><div style="font-size:28px">${c[0]}</div><h3 class="mt">${c[1]}</h3><p class="mu">${c[2]}</p></div>`).join('')}</div><div class="row mt"><button style="background:#fff;color:var(--p)" data-go="register">Get Started</button><button style="background:#fff3" data-go="login">Log In</button></div></div></div>`,
login:()=>`<div class="full"><div class="card"><div style="text-align:center">${logo(56)}</div><h1 style="text-align:center;margin:10px 0">Welcome Back</h1><p class="mu" style="text-align:center">Log in to continue. Try student or teacher.</p><label for="e">Email address</label><input id="e" value="primo.reyes@school.edu"><label for="pw">Password</label><div class="row" style="flex-wrap:nowrap"><input id="pw" type="password" value="password123"><button class="s" data-act="eye">Show</button></div><div class="row sp mt"><label style="margin:0;font-weight:400"><input type="checkbox" checked style="width:auto"> Remember me</label><a href="#" data-act="forgot">Forgot password?</a></div><button style="width:100%" class="mt" data-act="login">Log In</button><button style="width:100%" class="s mt" data-act="tlogin">Log in as teacher (Ms. Lans)</button><p class="mu" style="text-align:center">New here? <a href="#" data-go="register">Create account</a></p></div></div>`,
register:()=>`<div class="full"><div class="card"><div style="text-align:center">${logo(48)}</div><h2 style="text-align:center;margin:8px 0">Create your account</h2><label>Full name</label><input id="rn" placeholder="Your full name"><label>Email address</label><input id="re" type="email" placeholder="you@school.edu"><label>Password</label><input type="password"><label>Confirm password</label><input type="password"><label>I am a</label><select id="rl"><option>Student</option><option>Teacher</option></select><button style="width:100%" class="mt" data-act="reg">Create Account</button><p class="mu" style="text-align:center">Already have an account? <a href="#" data-go="login">Log In</a></p></div></div>`,
setup:()=>S.role==='teacher'?`<div class="full"><div class="card"><h2>Set up your instructor profile</h2><label>Department</label><input value="Information Technology"><label>Class / course name</label><input value="CS101 – Research Methods"><label>Invite students (emails)</label><textarea rows=2>primo.reyes@school.edu, bella.santos@school.edu</textarea><label>First group project</label><input value="Research Methods Paper"><button style="width:100%" class="mt" data-act="done">Finish setup</button></div></div>`:`<div class="full"><div class="card"><h2>Join your group</h2><p class="mu">Enter the invitation code from your instructor.</p><label>Invitation code</label><input value="GF-3K9Q"><label>Student ID</label><input placeholder="2024-00123"><label>Program & year</label><input value="BSIT – 2nd year"><button style="width:100%" class="mt" data-act="done">Join group</button><label>Project title (for a new group)</label><input id="sp" value="Research Methods Paper"><button class="s mt" style="width:100%" data-act="newg">Create a new group as leader</button></div></div>`,
dash:()=>lay(`${hello()}<div class="g g4 mt">${[['Overall progress',pct()+'%'],['Due today',S.tasks.filter(t=>t.due==='Oct 31'&&t.s!=='Done').length],['Overdue',S.tasks.filter(t=>t.od&&t.s!=='Done').length],['Completed',S.tasks.filter(t=>t.s==='Done').length]].map(x=>`<div class="card"><div class="mu">${x[0]}</div><h1>${x[1]}</h1></div>`).join('')}</div>
